name: Passagens (Aviasales)

# O cache da Aviasales guarda buscas dos ultimos 7 dias e a propria
# documentacao deles recomenda usa-lo para gerar pagina estatica. Uma
# vez por dia basta, e mantem o carimbo de data honesto na pagina.
on:
  schedule:
    - cron: "30 18 * * *"   # 18h30 UTC = 15h30 BRT, meia hora depois do cambio
  workflow_dispatch:         # botao para rodar na mao
  # Gatilho de teste: roda quando o proprio coletor ou este arquivo mudam.
  # Serve para validar o secret sem depender do botao do GitHub, que as
  # vezes demora a aparecer em workflow recem-criado. Nao dispara em push
  # de conteudo do site, so nestes dois caminhos.
  push:
    paths:
      - ".github/workflows/voos.yml"
      - "_build/voos/**"

permissions:
  contents: write

concurrency:
  group: voos
  cancel-in-progress: false

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar precos e reescrever as fichas
        env:
          AVIASALES_TOKEN: ${{ secrets.AVIASALES_TOKEN }}
        run: |
          if [ -z "$AVIASALES_TOKEN" ]; then
            echo "::error::O secret AVIASALES_TOKEN nao esta cadastrado no repositorio."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          python _build/voos/atualiza.py --aplica

      - name: Publicar, se algum preco mudou
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhum preco mudou hoje. Nada a publicar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Passagens: cache Aviasales do dia"
          git push
